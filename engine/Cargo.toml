[package]
name = "engine"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
dyn-clone = "1.0"
indexmap = "2.0"
log = "0.4"
macros = { path = "../macros" }
rand = "0.10"
thiserror = "2.0"
hashbrown = { version = "0.17", features = ["serde"]}
serde = { version = "1.0", features = ["derive"] }
typetag = "0.2"

[dev-dependencies]
bincode = { version = "2", features = ["serde"] }
