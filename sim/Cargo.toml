[package]
name = "sim"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = "0.18"
bevy_vector_shapes = "0.12"
engine = { path = "../engine" }
serde = { version = "1.0", features = ["derive"] }
macros = { path = "../macros" }
bevy_egui = "0.39"
egui_file = { git = "https://github.com/t348575/egui_file", branch = "bevy_egui"}
wincode = "0.5"
rand = "0.8"
flume = "0.12"
rayon = "1.9"
dashmap = { version = "6.1", features = ["rayon", "serde"] }
